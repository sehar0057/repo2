name: ci-wf
on: 
  pull_request:
    branches:
      - develop 
    types:
      - opened
      - syncronize
  push:
    branches:
      - develop
    jobs:
      litting-job:
        runs-on: ubuntu-latest
        steps:
          - name: Welcome steps
            run: echo "Welcome ti CI pipelines for this repo"
          - name: Checkout Repository
            uses: actions/checkout@v4
          - name: List HTML Files
            run: npx htmlhint "**/* .html"
          - name: List CSS Fiiles
            run: npx stylelint "**/* .css"
            
